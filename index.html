<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open House: a roguelite house builder. It's a house." />
    <title>Open House</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- The link preview in a group chat (D-135). Scrapers need absolute URLs: vite.config.ts's
         share-base plugin fills in the release's address, or develop's on /dev/. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open House" />
    <meta property="og:title" content="Open House" />
    <meta
      property="og:description"
      content="Build one house for one client, one piece a week. A roguelite house builder for the “It’s a house” game jam."
    />
    <meta property="og:image" content="%SHARE_BASE%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A finished house seen from above, its rooms furnished, on a grassy lot by the street, under a wood sign: Open House. It’s a house."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Until the game's script runs (a few seconds on a slow link), a word that it's coming;
         main.tsx clears it before the first render. -->
    <div id="app">
      <p
        style="
          margin: 0;
          height: 100%;
          display: grid;
          place-items: center;
          font:
            16px system-ui,
            sans-serif;
          color: var(--ink, #3b2f2a);
        "
      >
        Open House · loading…
      </p>
    </div>
    <noscript>
      <p
        style="
          text-align: center;
          font:
            16px system-ui,
            sans-serif;
        "
      >
        Open House needs JavaScript to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
